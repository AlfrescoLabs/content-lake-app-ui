<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hyland OpenArch&trade;</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hyland OpenArch - permission-aware search and RAG across your content repositories">
  <!-- Satori App Chrome: replace favicon with Hyland product icon when available -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    IBM Plex Sans — enterprise-grade variable font aligned with Hyland's typography direction.
    Replace with @hyland/ui typography mixin (@include hyland-ui-typography()) when
    @hyland/ui is integrated:
    https://hyland.atlassian.net/wiki/spaces/FE/pages/49348790/Typography+dev
  -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <!--
    Inter — used for editorial display headings to echo hyland.com's marketing
    typography (tighter tracking, larger optical sizing). IBM Plex remains the
    body face for enterprise text density.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Material Symbols Outlined — M3-aligned icon set -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <!-- Legacy Material Icons — kept for backward compat until full Satori icon migration -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
